<!--
  pm-watcher · 我的世界杯 平行宇宙冠军机 (preview v2)
  - 第一步：左16/右16 真实签表选队，已淘汰队不可送上奖杯
  - 全流程在一张交互卡内完成
  - 视觉沿用 pm-watcher：浅色看板底 + 球队小卡 SVG 系统(皇家蓝/柠檬绿/FWC字体/斜杠数字/二维码/校准而非预测)
  - 分享卡一键下载 (SVG→Canvas→PNG，内嵌字体)
  接入说明：SNAPSHOT/BRACKET 换成真实 /api/board + RECAP_KO；FLAGS/字体已用项目同名资源。
-->
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>平行宇宙冠军机 · Alternate Universe</title>

<style>
/* ====== 注入：FWC 字体(base64) ====== */
@font-face{font-family:'FWCBlack';src:url('fonts-subset/FWC2026-Black.woff2') format('woff2');font-display:swap;}@font-face{font-family:'FWCNBlack';src:url('fonts-subset/FWC2026-NormalBlack.woff2') format('woff2');font-display:swap;}@font-face{font-family:'FWCNormal';src:url('fonts-subset/FWC2026-Normal.woff2') format('woff2');font-display:swap;}@font-face{font-family:'FWCCond';src:url('fonts-subset/FWC2026-UltraCond.woff2') format('woff2');font-display:swap;}@font-face{font-family:'FWCLight';src:url('fonts-subset/FWC2026-CondLight.woff2') format('woff2');font-display:swap;}
:root{
  --bg:#faf9f6; --card:#ffffff; --ink:#2c2c2a; --mut:#6b6a64; --hint:#9a988f;
  --line:rgba(0,0,0,.10); --line2:rgba(0,0,0,.06);
  --pu:#7c5cff; --pu-soft:rgba(124,92,255,.10);
  --up:#1d9e75; --down:#d85a30;
  --royal:#2b3fc4; --lime:#a9d52b;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --fwc:"FWCBlack",var(--sans);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;line-height:1.5}
.wrap{max-width:1000px;margin:0 auto;padding:22px 18px 70px}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.brand h1{margin:0;font-size:21px;font-weight:800;letter-spacing:-.01em}
.brand .sub{font-size:12.5px;color:var(--mut);margin-top:3px}
.brand .pu{color:var(--pu);font-weight:700}
.langtog{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;font-size:12.5px}
.langtog button{background:transparent;color:var(--mut);border:0;padding:6px 14px;cursor:pointer;font-family:inherit}
.langtog button[aria-pressed="true"]{background:var(--ink);color:#fff}

/* ===== ONE card ===== */
.machine{border:1.5px solid var(--line);border-radius:20px;background:
  linear-gradient(135deg,var(--card),rgba(124,92,255,.045));overflow:hidden;position:relative}
.mhead{padding:20px 22px 0}
.mtag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:var(--pu);background:var(--pu-soft);padding:3px 10px;border-radius:999px}
.mhead h2{margin:11px 0 6px;font-size:23px;font-weight:800;letter-spacing:-.01em}
.mhead p{margin:0;font-size:13px;color:var(--mut);max-width:600px}
.stepnav{display:flex;gap:7px;margin:16px 0 0;padding:0 22px}
.stepnav .s{font-size:11px;color:var(--hint);display:flex;align-items:center;gap:6px}
.stepnav .s b{width:18px;height:18px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;
  font-size:10.5px;font-weight:700;color:var(--hint)}
.stepnav .s.on b{background:var(--pu);border-color:var(--pu);color:#fff}
.stepnav .s.on{color:var(--ink);font-weight:600}
.stepnav .arr{color:var(--line)}

/* ===== Stage 1: bracket picker ===== */
.stage{padding:18px 22px 24px}
.brkt{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}
.col{display:flex;flex-direction:column;gap:7px}
.tie{border:.5px solid var(--line);border-radius:10px;background:var(--card);overflow:hidden}
.row{display:flex;align-items:center;gap:7px;padding:7px 9px;cursor:pointer;transition:background .14s;border:none;background:transparent;width:100%;font-family:inherit;text-align:left;color:var(--ink)}
.col.r .row{flex-direction:row-reverse;text-align:right}
.row+.row{border-top:.5px solid var(--line2)}
.row:hover:not(.elim){background:var(--pu-soft)}
.row .fg{width:22px;height:15px;border-radius:2px;flex:0 0 auto;object-fit:cover;box-shadow:0 0 0 .5px var(--line)}
.row .nm{flex:1 1 auto;min-width:0;font-size:12.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .sc{font-size:12px;color:var(--mut);font-variant-numeric:tabular-nums;flex:0 0 auto}
.row.win .nm{font-weight:700}
.row.win .sc{color:var(--ink)}
.row.elim{opacity:.55}
.row.elim .nm{text-decoration:line-through}
.row.elim:hover{background:rgba(216,90,48,.06)}
.read .exittag{font-size:12px;font-weight:700;color:var(--pu);background:var(--pu-soft);display:inline-block;padding:4px 11px;border-radius:8px;margin-bottom:11px;line-height:1.4}
.read .exitstory{font-size:13.5px;color:var(--ink);line-height:1.62;margin:6px 0 12px}
.row.sel{background:linear-gradient(90deg,var(--pu-soft),transparent)}
.col.r .row.sel{background:linear-gradient(270deg,var(--pu-soft),transparent)}
.row.sel .nm{color:var(--pu);font-weight:800}
.row .pr{font-size:10px;color:var(--hint);font-variant-numeric:tabular-nums;flex:0 0 auto}
.center{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:120px}
.trophy{width:118px;min-height:92px;border:1.5px dashed var(--line);border-radius:14px;
  background:linear-gradient(135deg,#fff,var(--pu-soft));display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:5px;text-align:center;padding:10px;transition:.16s}
.trophy.armed{border-style:solid;border-color:var(--pu);box-shadow:0 6px 22px rgba(124,92,255,.18)}
.trophy.drop{border-color:var(--pu);background:var(--pu-soft)}
.trophy .ic{font-size:26px;line-height:1}
.trophy .lbl{font-size:11px;color:var(--hint);font-weight:600}
.trophy .pick{font-size:14px;font-weight:800;color:var(--pu)}
.trophy .fg{width:30px;height:20px;border-radius:3px;box-shadow:0 0 0 .5px var(--line)}
.picknote{font-size:11px;color:var(--hint);text-align:center;max-width:130px}
.radialwrap{max-width:780px;margin:0 auto;text-align:center;border-radius:24px;
  background:radial-gradient(60% 60% at 50% 45%,#141a3e,#0a0e24);
  box-shadow:0 18px 60px rgba(10,14,40,.5),inset 0 0 0 1px rgba(139,123,255,.12);padding:6px}
.radialwrap svg{width:100%;height:auto;display:block;touch-action:none}
.radialwrap .lf .lfbg{transform-box:fill-box;transform-origin:center;transition:transform .14s,filter .14s}
.radialwrap .lf:hover .lfbg{transform:scale(1.12)}
.baseedge{stroke:rgba(150,175,255,.16);stroke-width:1.3;transition:stroke .18s,stroke-width .18s}
.baseedge.prev{stroke:rgba(139,123,255,.8);stroke-width:2.4}
.litedge{stroke:#8b7bff;stroke-width:3.4;stroke-linecap:round;stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:draw .5s cubic-bezier(.4,0,.2,1) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.radialwrap .halo{animation:halo 1.7s ease-in-out infinite}
@keyframes halo{0%,100%{opacity:.4;stroke-width:2}50%{opacity:.9;stroke-width:4}}
.dragline{animation:dashflow .55s linear infinite}
@keyframes dashflow{to{stroke-dashoffset:-26}}
.dragline.snap{stroke:#4dffd0;stroke-width:4.5}
.radialwrap .spin{transform-origin:380px 380px;animation:spin 60s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.radialwrap .pulse{transform-origin:380px 380px;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.85;transform:scale(1)}50%{opacity:1;transform:scale(1.06)}}
.pickcap{font-size:13.5px;color:#c9d1ff;margin:2px 0 12px;min-height:20px}
.pickcap b{color:#a99bff;font-weight:800}
@media(prefers-reduced-motion:reduce){.litedge{animation:none;stroke-dashoffset:0}.spin,.pulse{animation:none}}

.runbar{display:flex;gap:10px;align-items:center;margin-top:20px;flex-wrap:wrap;justify-content:center}
.btn{font-family:inherit;font-weight:600;font-size:14px;border-radius:10px;border:1px solid transparent;padding:11px 20px;cursor:pointer;transition:.14s}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-pu{background:var(--pu);color:#fff}.btn-pu:hover:not(:disabled){filter:brightness(1.06)}
.btn-dark{background:var(--ink);color:#fff}.btn-dark:hover:not(:disabled){filter:brightness(1.12)}
.btn-ghost{background:transparent;color:var(--ink);border-color:var(--line)}.btn-ghost:hover{border-color:var(--mut)}

/* ===== Stage 2: result (single column, landscape card) ===== */
.result1{max-width:1000px;margin:0 auto}
.cardwrap{position:relative;filter:drop-shadow(0 16px 40px rgba(20,16,50,.30));animation:cardin .55s cubic-bezier(.2,.7,.2,1)}
@keyframes cardin{from{opacity:0;transform:translateY(16px) scale(.985)}to{opacity:1;transform:none}}
.cardwrap::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.22) 48%,transparent 62%);
  transform:translateX(-120%);animation:sheen 1.1s ease .35s 1}
@keyframes sheen{to{transform:translateX(120%)}}
.cardwrap svg{width:100%;height:auto;display:block}
.result1 .mod{animation:modin .45s both cubic-bezier(.2,.7,.2,1)}
.result1 .mod:nth-child(1){animation-delay:.05s}.result1 .mod:nth-child(2){animation-delay:.12s}
.result1 .mod:nth-child(3){animation-delay:.19s}.result1 .mod:nth-child(4){animation-delay:.26s}
.result1 .mod:nth-child(5){animation-delay:.33s}
@keyframes modin{from{opacity:0;transform:translateX(10px)}to{opacity:1;transform:none}}
.cardactions{display:flex;flex-wrap:wrap;gap:9px;margin:16px 0 6px;justify-content:center}
.explore{font-size:11.5px;color:var(--hint);width:100%;text-align:center;margin-top:2px}
.explore b{color:var(--pu)}
.read{max-width:680px;margin:22px auto 0}
.read .exittag{font-size:13px;font-weight:700;color:var(--pu);background:var(--pu-soft);display:inline-block;padding:5px 12px;border-radius:8px;margin-bottom:12px;line-height:1.4}
.read .lead{font-size:19px;font-weight:700;line-height:1.45;margin-bottom:4px}
.read .lead .hl{color:var(--pu)}
.read .leadsub{font-size:12.5px;color:var(--mut);margin-bottom:14px}
.read .leadsub b{color:var(--down)}
.elimnote{font-size:12.5px;color:var(--mut);background:rgba(216,90,48,.06);border:1px solid rgba(216,90,48,.22);
  border-radius:10px;padding:9px 12px;margin-bottom:14px;line-height:1.55}
.elimnote .tag{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#fff;background:var(--down);
  border-radius:5px;padding:2px 7px;margin-right:6px}
.elimnote b{color:var(--ink)}
.routelbl{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--hint);margin:2px 0 12px}
/* 路径断点：封条 + 市场原价 + 判决章 */
.mods{display:flex;flex-direction:column;gap:0;margin:0 0 16px}
.mod{padding:14px 0;border-bottom:1px dashed var(--line);position:relative}
.mod::after{content:"";position:absolute;left:38%;bottom:-4px;width:7px;height:7px;border-radius:50%;background:var(--pu);opacity:.5}
.mod:last-child{border-bottom:0}
.mod:last-child::after{display:none}
.modtop{display:flex;align-items:center;gap:9px;margin-bottom:9px}
.mod .rc{font-size:11px;font-weight:800;color:#fff;background:var(--pu);padding:3px 12px 3px 9px;letter-spacing:.02em;clip-path:polygon(0 0,100% 0,88% 50%,100% 100%,0 100%);transform:rotate(-2deg)}
.mod.def .rc{background:var(--down)}
.mod .mf{width:23px;height:15px;border-radius:2px;object-fit:cover;box-shadow:0 0 0 .5px var(--line)}
.mod .mo{font-size:14px;font-weight:800;color:var(--ink)}
.mod .mp{margin-left:auto;font-size:11.5px;font-weight:600;color:var(--mut);font-variant-numeric:tabular-nums;text-decoration:line-through;text-decoration-color:var(--down);text-decoration-thickness:1.5px}
.mod .mp b{color:var(--down);font-weight:800;text-decoration:none;margin-left:5px;font-size:10.5px}
.mtag{display:inline-block;font-size:16.5px;font-weight:800;line-height:1.3;color:var(--pu);border:2px solid var(--pu);border-radius:6px;padding:5px 11px;margin:1px 0 7px;transform:rotate(-.6deg);box-shadow:2px 2px 0 var(--pu-soft)}
.mod.def .mtag{color:var(--down);border-color:var(--down);box-shadow:2px 2px 0 rgba(216,90,48,.12)}
.mod .mexp{font-size:12.5px;color:var(--mut);line-height:1.55}
.punch{font-size:12.5px;color:var(--mut);line-height:1.6}
.punch .sk{color:var(--down);font-weight:600}.punch .al{color:var(--pu);font-weight:600}
.guard{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;letter-spacing:.06em;color:var(--up);
  border:1px solid rgba(29,158,117,.3);border-radius:999px;padding:4px 10px;margin-top:10px}
@media(max-width:720px){.brkt{font-size:12px}.story{font-size:14.5px}}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(20,18,30,.45);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:20px;z-index:50}
.scrim.on{display:flex}
.modal{width:min(380px,100%);background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px}
.modal h3{margin:0 0 6px;font-size:18px;font-weight:800}
.modal p{margin:0 0 16px;font-size:12.5px;color:var(--mut)}
.modal label{display:block;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--hint);margin-bottom:7px}
.modal input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:11px 13px;font-size:15px;font-family:inherit;color:var(--ink)}
.modal input:focus{outline:2px solid var(--pu);outline-offset:1px;border-color:transparent}
.modal .row2{display:flex;gap:9px;margin-top:18px}.modal .row2 .btn{flex:1}

.cappanel{max-width:760px;margin:10px auto 0;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:9px}
.cappanel .caphead{font-size:12.5px;color:var(--mut);letter-spacing:.03em}
.cappanel textarea{width:100%;box-sizing:border-box;resize:vertical;border:1px solid var(--line);border-radius:9px;padding:10px 12px;font-size:13.5px;line-height:1.55;color:var(--ink);background:var(--bg);font-family:inherit}
.cappanel .btn{align-self:flex-end}
html.embed body{background:transparent}
html.embed .wrap{max-width:none;padding:0}
html.embed .top{display:none}
html.embed .machine{border:0;border-radius:0;background:transparent;box-shadow:none}
html.embed .mhead{padding:18px 20px 0}
.radialwrap svg{touch-action:none}
.imgsheet{position:fixed;inset:0;background:rgba(15,14,30,.68);display:none;align-items:center;justify-content:center;z-index:80;padding:18px}
.imgsheet.on{display:flex}
.imgsheet .isbox{max-width:min(92vw,600px);width:100%;display:flex;flex-direction:column;gap:10px}
.imgsheet img{width:100%;border-radius:10px;box-shadow:0 18px 50px rgba(0,0,0,.5)}
.imgsheet .ishint{color:#fff;font-size:13.5px;text-align:center;letter-spacing:.02em}
.imgsheet .isclose{align-self:center;min-width:120px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(16px);background:var(--ink);color:#fff;font-size:13px;padding:10px 17px;border-radius:9px;opacity:0;transition:.2s;pointer-events:none;z-index:60}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

.ctaline{text-align:center;margin-top:30px;padding-top:22px;border-top:1px solid var(--line);font-size:15px;color:var(--pu);font-weight:600}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

  <div class="top">
    <div class="brand">
      <h1>我的世界杯 · <span class="pu">平行宇宙</span></h1>

</div>

        var b0 = bin.read();

        var b2 = read();

      var bytes = [];

        if (c < 128) {

    if(!ko.length){ recomputeElim(); return; }
    // 以 API 为权威：转成 KO_RESULTS 结构并合并（同一对阵以 API 覆盖内置）
    const conv=ko.map(m=>({round:m.round,home:m.home,away:m.away,sa:m.sa,sb:m.sb,
      winner:m.result==="A"?m.home:(m.result==="B"?m.away:null),pens:(m.sa===m.sb)}));
    const keep=KO_RESULTS.filter(o=>!conv.some(n=>(n.home===o.home&&n.away===o.away)||(n.home===o.away&&n.away===o.home)));

}

const ROUNDS=[{id:"R32",zh:"1/16 决赛",en:"Round of 32"},{id:"R16",zh:"1/8 决赛",en:"Round of 16"},{id:"QF",zh:"1/4 决赛",en:"Quarter-final"},{id:"SF",zh:"半决赛",en:"Semi-final"},{id:"Final",zh:"决赛",en:"Final"}];
// expected advancer of a sub-bracket range [a,b) of a side: actual winner if decided, else higher-title team
function expectAdvance(side,a,b,round){
  const pick=(arr)=>{let best=null;for(const c of arr){if(!PROF[c])continue;if(!best||PROF[c].title>PROF[best].title)best=c;}return best;};
  // 该区块里，若某队在"上一轮"已有真实胜绩，它就是真实晋级者；优先返回真实结果
  let realAdvancers=[], alive=[], all=[];
  for(let i=a;i<b;i++){const tie=BRACKET[side][i];const w=winnerOfTie(tie);
    const cs=(w?[w]:[tie[0],tie[1]]);
    for(const c of cs){ all.push(c); if(!ELIM.has(c)) alive.push(c);
      // c 若在目标轮的前一轮真实赢球，则确定晋级到本轮
      if(round){ const prevIdx=RORD[round]-1; const prevRd=Object.keys(RORD).find(k=>RORD[k]===prevIdx);
        if(prevRd){ const m=koResultOfTeam(c,prevRd); if(m&&m.winner===c) realAdvancers.push(c); } } } }
  // 真实晋级者里挑（同块多个真实胜者取 title 最高，实际上一块只会有一个）；否则未淘汰者；再否则全体
  return pick(realAdvancers) || pick(alive) || pick(all) || null;
}
function findTie(champion){
  for(const side of["L","R"])for(let i=0;i<8;i++){const t=BRACKET[side][i];if(t[0]===champion||t[1]===champion)return{side,i};}
  return null;
}
function buildPath(champion){
  const pos=findTie(champion); if(!pos)return[];
  const {side,i}=pos; const legs=[];
  // R32 opponent = the other team in the tie
  const t=BRACKET[side][i]; const r32opp=t[0]===champion?t[1]:t[0];
  legs.push(mkLeg("R32",champion,r32opp));
  // subsequent rounds: opponent = expected advancer of the sibling block
  // block size doubles each round; champion's index within side = i
  let lo=i, size=1;
  for(let r=1;r<5;r++){
    size*=2; const blockStart=Math.floor(lo/size)*size; const half=size/2;
    const champHalf=Math.floor((lo-blockStart)/half); // 0 or 1
    let oppA,oppB;
    if(r<4){ // opponent comes from sibling half within this side
      if(champHalf===0){oppA=blockStart+half;oppB=blockStart+size;} else {oppA=blockStart;oppB=blockStart+half;}
      const opp=expectAdvance(side,oppA,oppB,ROUNDS[r].id);
      legs.push(mkLeg(ROUNDS[r].id,champion,opp));
    } else { // Final: opponent = expected winner of the OTHER side entirely
      const other=side==="L"?"R":"L";
      const opp=expectAdvance(other,0,8,"Final");
      legs.push(mkLeg("Final",champion,opp));
    }
  }
  return legs;
}
function mkLeg(round,champ,opp){
  if(!opp||!PROF[opp]){ // 兜底：找一个 PROF 内、非 champ、未在本路径出现的合理对手
    const fallback=ALL.find(t=>t!==champ&&PROF[t]&&!ELIM.has(t))||ALL.find(t=>t!==champ&&PROF[t])||champ;
    opp=fallback;
  }
  const op=(PROF[opp]?PROF[opp].title:0),cp=(PROF[champ]?PROF[champ].title:0);
  return{round,opp,oppProb:op,defied:op>cp,gap:Math.max(0,op-cp)};
}

/* ========================= generate universe ========================= */
function genUniverse(champion,seed){
  // 现实进度：该队已在现实里赢下的淘汰赛轮数（优先 /api/recap 实时结果，兜底签表赛果）
  const survived=realWinsOf(champion);
  const tv=VAR.filter(v=>v.en===champion); const v=draw(tv,seed);
  const path=buildPath(champion);
  const defied=Math.max(1,path.filter(l=>l.defied).length);
  const ridic=Math.round(clamp(58+defied*5+(3-Math.min(v.title,3))*5+(v.cardProb<.2?9:v.cardProb<.8?5:0),0,99));
  const beatIdx=path.map((l,i)=>Math.floor(seeded(seed+":b"+i)*3));
  const marketIdx=path.map((l,i)=>Math.floor(seeded(seed+":m"+i)*MARKET_BEAT.length));
  const _dx=ELIM.has(champion)?realLossOf(champion):null;
  const realExit=_dx?Object.assign({},REAL_EXIT[champion]||{},_dx):null;
  return{kind:"champ",champion,seed,pid:v.pid,pnm:v.pnm,title:v.title,cardProb:v.cardProb,rarity:rkey(v.cardProb),
    ally:{label:PLAT[v.ally.key].label,prob:v.ally.prob},skeptic:{label:PLAT[v.skeptic.key].label,prob:v.skeptic.prob},
    path,beatIdx,marketIdx,defied,ridic,aft:Math.floor(seeded(seed+":a")*AFTER.length),punch:Math.floor(seeded(seed+":p")*PUNCH.length),
    headIdx:Math.floor(seeded(seed+":h")*3),eliminated:!!realExit,realExit,survived,snapshotId:SNAPSHOT.snapshotId,updated:SNAPSHOT.updated};
}

function rollOf(R){const p=String(R.seed||"").split("|");const n=parseInt(p[p.length-1],10);return isNaN(n)?0:n;}
function legPool(R,leg){const bank=OPP_EVENT[leg.opp];
  let arr=bank?((bank[leg.round]||[]).concat(bank._any||[])).slice():[];
  if(LANG==="zh"&&typeof CORPUS_ZH!=="undefined"){
    const co=(CORPUS_ZH.opp[leg.opp]||[]).filter(e=>!e.r||e.r.indexOf(leg.round)>=0);
    const cc=(CORPUS_ZH.champ[R.champion]||[]).filter(e=>!e.r||e.r.indexOf(leg.round)>=0);
    for(const e of co.concat(cc))arr.push({tag:{zh:e.t,en:e.t},exp:{zh:e.e,en:e.e}});
  }
  return arr;}
function legEvent(R,leg,i){
  if(!R.__ev)R.__ev={};const ck=LANG+":"+i;if(R.__ev[ck])return R.__ev[ck];
  // 先确定 0..i-1 的取词（去重的确定性依赖顺序）
  const usedTags=[];for(let j=0;j<i;j++)usedTags.push(legEvent(R,R.path[j],j).tag);
  const arr=legPool(R,leg);let out=null;
  if(arr.length){
    const base=Math.floor(seeded(R.champion+"|"+leg.opp+"|"+leg.round+"|"+i)*997);
    const roll=rollOf(R);
    for(let k=0;k<arr.length;k++){
      const c=arr[(base+roll+k)%arr.length];
      if(usedTags.indexOf(c.tag[LANG])<0){out={tag:c.tag[LANG],exp:c.exp[LANG]};break;}}
    if(!out){const c=arr[(base+roll)%arr.length];out={tag:c.tag[LANG],exp:c.exp[LANG]};}
  }else{
    const opp=nameOf(leg.opp);
    const nk=TEAM_TAG[leg.opp]?TEAM_TAG[leg.opp][LANG]:(LANG==="zh"?("硬吃"+opp):("outlast "+opp));
    const hk=(HOOK[leg.opp]&&HOOK[leg.opp][LANG])?HOOK[leg.opp][LANG]:HOOK._default[LANG](opp);
    out={tag:nk,exp:hk};
  }
  R.__ev[ck]=out;return out;

function legEventAlt(R,leg,i,k,ex){
  let pool=[];const bank=OPP_EVENT[leg.opp];
  if(bank){pool=(bank._any||[]).slice();for(const rd of ["R32","R16","QF","SF","Final"])if(bank[rd])pool=pool.concat(bank[rd]);}
  let tags=[],seen={};
  for(const c of pool){const t=c.tag[LANG];if(!seen[t]&&ex.indexOf(t)<0){seen[t]=1;tags.push(t);}}
  if(LANG==="zh"&&typeof CORPUS_ZH!=="undefined"){
    for(const e of (CORPUS_ZH.opp[leg.opp]||[]).concat(CORPUS_ZH.champ[R.champion]||[])){
      if(!seen[e.t]&&ex.indexOf(e.t)<0){seen[e.t]=1;tags.push(e.t);}}}
  const tt=TEAM_TAG[leg.opp]?TEAM_TAG[leg.opp][LANG]:null;
  if(tt&&!seen[tt]&&ex.indexOf(tt)<0){seen[tt]=1;tags.push(tt);}
  for(const u of UNIV_TAG){const t=u[LANG];if(!seen[t]&&ex.indexOf(t)<0){seen[t]=1;tags.push(t);}}
  if(!tags.length)return null;
  const base=Math.floor(seeded(R.champion+"|"+leg.opp+"|alt"+i+":"+k)*997);
  return tags[(base+rollOf(R))%tags.length];}

function flowRuns(runs,x,y,width,fs,lh,colors,maxLines){

  const wOf=ch=>isNarrow(ch)?fs*0.55:fs*1.0;

    if(ch==="\n"){lines.push(cur);cur=[];cw=0;continue;}

    if(cw+w>width&&ch!==" "){lines.push(cur);cur=[];cw=0;}
    cur.push([ch,r.c]);cw+=w;
  }}
  if(cur.length)lines.push(cur);
  const use=maxLines?lines.slice(0,maxLines):lines;let out="",yy=y;
  for(const ln of use){let spans="",buf="",role=null;

  const finish=()=>{if(drag){const t=drag.team;drag=null;dl.setAttribute("opacity","0");dl.classList.remove("snap");svg.classList.remove("snapping");selectChamp(t);}};
  svg.addEventListener("pointerup",finish);svg.addEventListener("pointerleave",finish);
  $("#run").onclick=()=>{if(STATE.champion){STATE.stage="result";STATE.explored=0;STATE.nonce=0;STATE.minted=false;STATE.nick="";spin();}};
  notifyResize(false);
}
function selectChamp(en){STATE.champion=en;renderPick();renderStep();}
function makeSeed(){return `${STATE.nick}|${STATE.champion}|${SNAPSHOT.snapshotId}|${STATE.nonce}`;}
function spin(){
  try{
    STATE.nonce++;STATE.explored++;
    STATE.current=genUniverse(STATE.champion,makeSeed());
    renderStep();renderResult();
  }catch(err){
    console.error("[pm-watcher] 推演失败:",err);
    try{ const st=document.getElementById("stage");
      if(st) st.innerHTML='<div style="padding:28px;color:#d85a30;font-size:14px;line-height:1.7">推演时出错了，请把这段报错发给作者：<br><code style="display:block;margin-top:8px;white-space:pre-wrap;color:#6b6a64">'+((err&&err.message)||err)+'</code></div>';
    }catch(_){}
    try{ if(typeof toast==="function") toast("推演出错，详见页面提示"); }catch(_){}
  }
}

// 页面流动叙事（HTML，高亮不分点）
function htmlModules(R){return R.path.map((leg,i)=>{const e=legEvent(R,leg,i);const opp=nameOf(leg.opp);
  const oc=(TEAM[leg.opp]||{}).code;const rd=ROUNDS.find(r=>r.id===leg.round)[LANG];
  return `<div class="mod ${leg.defied?'def':''}">
    <div class="modtop"><span class="rc">${rd}</span>
      ${oc&&FLAGS[oc]?`<img class="mf" src="${FLAGS[oc]}" alt="">`:''}
      <span class="mo">${opp}</span><span class="mp">${LANG==='zh'?'市场定价 ':''}${pct(leg.oppProb)}<b>${leg.defied?(LANG==='zh'?'市场误判':'MISPRICED'):(LANG==='zh'?'定价击穿':'BROKEN')}</b></span></div>
    <div class="mtag">${e.tag}</div><div class="mexp">${e.exp}</div></div>`;}).join("");}
function notifyResize(scrollIntoStage){
  try{
    const h=Math.max(document.documentElement.scrollHeight, document.body.scrollHeight);
    if(window.self!==window.top){ window.parent.postMessage({type:"pu-height",height:h},"*"); }
    if(scrollIntoStage){ const st=document.getElementById("stage"); if(st&&st.scrollIntoView) st.scrollIntoView({behavior:"smooth",block:"start"}); }
  }catch(e){}
}
function renderResult(){
  const R=STATE.current;if(!R)return;
  const svg=buildSVG(R,STATE.minted?{exp:true,nick:STATE.nick,explored:STATE.explored}:{}).split("__RT_DEFS__").join("");
  const strs=[headline(R),L('lead',pct(R.cardProb),RARITY[R.rarity][LANG]),AFTER[R.aft][LANG](nameOf(R.champion)),
    PUNCH[R.punch][LANG](R.skeptic.label,pct(R.skeptic.prob),R.ally.label),...R.path.map((l,i)=>legCopy(R,l,i))];
  const lr=lint(strs);
  const elimNote=R.eliminated?`<div class="elimnote"><span class="tag">${LANG==='zh'?'现实赛果':'reality'}</span> ${LANG==='zh'
    ?`<b>${nameOf(R.champion)}</b> 已在 ${ROUNDS.find(r=>r.id===R.realExit.round)[LANG]} 止步（${R.realExit.sc} 负 ${nameOf(R.realExit.opp)}）——以下是它本可以走的那条平行宇宙。`
    :`<b>${nameOf(R.champion)}</b> went out in the ${ROUNDS.find(r=>r.id===R.realExit.round)[LANG]} (${R.realExit.sc} to ${nameOf(R.realExit.opp)}) — here is the universe it could have walked.`}</div>`:"";
  const readHTML=`
    <div class="exittag">${headline(R)}</div>
    <div class="lead">${L('lead',pct(R.cardProb),RARITY[R.rarity][LANG])}</div>
    <div class="leadsub">${L('leadsub',pct(R.title),R.defied)}</div>
    ${elimNote}
    <div class="routelbl">${L('routeLabel')}</div>
    <div class="mods">${htmlModules(R)}</div>
    <div class="punch">${PUNCH[R.punch][LANG](R.skeptic.label,pct(R.skeptic.prob),R.ally.label)}</div>
    <div class="guard">${lr.ok?L('guard'):'⚠ '+String(lr.hit)}</div>`;
  const actions = STATE.minted
    ? `<button class="btn btn-dark" id="dl">⤓ ${L('download')}</button><button class="btn btn-ghost" id="cap">${LANG==='zh'?'✍ 复制发帖文案':'✍ Copy caption'}</button><button class="btn btn-ghost" id="reroll">${L('reroll')}</button><button class="btn btn-ghost" id="back">${L('back')}</button>`
    : `<button class="btn btn-pu" id="mint">${L('mintBtn')}</button><button class="btn btn-ghost" id="reroll">${L('reroll')}</button><button class="btn btn-ghost" id="back">${L('back')}</button>`;
  $("#stage").innerHTML=`<div class="result1">
    <div class="cardwrap">${svg}</div>
    <div class="cardactions">${actions}<span class="explore">${L('explore',STATE.explored)}</span></div>
    <div class="cappanel" id="cappanel" hidden>
      <div class="caphead">${LANG==='zh'?'一键发帖文案（已按稀有度自动生成）':'Ready-to-post caption'}</div>
      <textarea id="captext" readonly rows="4"></textarea>
      <button class="btn btn-dark" id="capcopy">${LANG==='zh'?'复制':'Copy'}</button>
    </div>
    <div class="read">${readHTML}</div>
  </div>`;
  if($("#reroll"))$("#reroll").onclick=spin;
  $("#back").onclick=()=>{STATE.stage="pick";renderStep();renderPick();};
  if($("#mint"))$("#mint").onclick=openMint;
  if($("#dl"))$("#dl").onclick=downloadCard;
  if($("#cap"))$("#cap").onclick=()=>showCaption(false);
  notifyResize(true);
}
/* 发帖配文：稀有度+存活状态+最后一道判决 组合钩子 */
function postCopy(R){const zh=LANG==='zh';const t=TEAM[R.champion];const p=pct(R.cardProb);
  const tier=R.eliminated?(zh?'隐藏款':'HIDDEN'):(R.cardProb<0.7?(zh?'传说款':'LEGENDARY'):R.cardProb<1.0?(zh?'史诗款':'EPIC'):R.cardProb<2.8?(zh?'稀有款':'RARE'):(zh?'共识款':'STANDARD'));
  const finTag=legEvent(R,R.path[R.path.length-1],R.path.length-1).tag;
  const hook=R.eliminated?(zh?'这个宇宙在现实里已经终结——所以它反而最稀有。':'This universe already ended in reality — which makes it the rarest kind.')
    :(zh?`宇宙还活着,已应验 ${R.survived}/5 关。`:`Still alive — ${R.survived}/5 verified so far.`);
  return zh?`我抽到了${t.zh}夺冠的平行宇宙 🎫 稀有度 ${p} · ${tier}。决赛判决:「${finTag}」。${hook}你的票是哪张?\n#世界杯2026 #平行宇宙冠军机 #pmwatcher #校准而非预测`
    :`I pulled the ${t.en} championship universe 🎫 rarity ${p} · ${tier}. Final verdict: "${finTag}". ${hook} Which ticket is yours?\n#WorldCup2026 #ParallelUniverse #pmwatcher`;}
function showCaption(auto){const R=STATE.current;if(!R)return;const txt=postCopy(R);
  const pn=$("#cappanel"),ta=$("#captext");if(!pn)return;pn.hidden=false;ta.value=txt;
  const doCopy=()=>{const ok=()=>toast(LANG==='zh'?'文案已复制,直接去粘贴发帖':'Caption copied');
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(ok,()=>{ta.select();document.execCommand('copy');ok();});
    else{ta.select();document.execCommand('copy');ok();}};
  $("#capcopy").onclick=doCopy;if(auto)doCopy();
  pn.scrollIntoView({behavior:'smooth',block:'nearest'});
}
function openMint(){$("#scrim").classList.add("on");setTimeout(()=>$("#nick").focus(),50);}
function closeMint(){$("#scrim").classList.remove("on");}
function doMint(){STATE.nick=($("#nick").value||"").trim()||L('anon');STATE.minted=true;
  STATE.current=genUniverse(STATE.champion,makeSeed());closeMint();renderStep();renderResult();}

/* download: SVG -> Canvas -> PNG (fonts embedded in SVG defs) */
function downloadCard(){
  const R=STATE.current;const svg0=buildSVG(R,{exp:true,nick:STATE.nick,explored:STATE.explored});
  embedForExport(svg0).then(svg=>{
  const vb=(svg.match(/viewBox="[^"]*?\s([\d.]+)\s([\d.]+)"/)||[0,1568,688]);const VBW=+vb[1],VBH=+vb[2];
  const W=1680,H=Math.round(VBH/VBW*1680),M=88,CW=W+M*2,CH=H+M*2;
  const blob=new Blob([svg],{type:"image/svg+xml;charset=utf-8"});const u=URL.createObjectURL(blob);
  const img=new Image();
  img.onload=()=>{const c=document.createElement("canvas");c.width=CW;c.height=CH;const ctx=c.getContext("2d");
    ctx.fillStyle="#ece9e0";ctx.fillRect(0,0,CW,CH);ctx.save();ctx.shadowColor="rgba(20,16,50,.42)";ctx.shadowBlur=58;ctx.shadowOffsetY=28;
    ctx.drawImage(img,M,M,W,H);ctx.restore();URL.revokeObjectURL(u);
    const coarse=(typeof matchMedia!=="undefined"&&matchMedia("(pointer:coarse)").matches)||("ontouchstart" in window);
    if(coarse){ const du=c.toDataURL("image/png"); showImgSheet(du); toast(LANG==="zh"?"长按图片即可保存":"Long-press to save"); showCaption(true); }
    else c.toBlob(b=>{if(!b)return;const a=document.createElement("a");a.href=URL.createObjectURL(b);
      a.download=`pm-watcher-parallel-${R.champion.replace(/\s+/g,'-')}.png`;document.body.appendChild(a);a.click();a.remove();toast(L('dlToast'));showCaption(true);});};
  img.onerror=()=>URL.revokeObjectURL(u);
  img.src=u;
  });
}
function showImgSheet(dataURL){
  let sh=$("#imgsheet");
  if(!sh){ sh=document.createElement("div"); sh.id="imgsheet"; sh.className="imgsheet";
    sh.innerHTML='<div class="isbox"><div class="ishint"></div><img alt="ticket"/><button class="btn btn-dark isclose"></button></div>';
    document.body.appendChild(sh);
    sh.addEventListener("click",e=>{ if(e.target===sh) sh.classList.remove("on"); });
    sh.querySelector(".isclose").onclick=()=>sh.classList.remove("on"); }
  sh.querySelector("img").src=dataURL;
  sh.querySelector(".ishint").textContent=LANG==="zh"?"长按图片保存到相册":"Long-press the image to save";
  sh.querySelector(".isclose").textContent=LANG==="zh"?"完成":"Done";
  sh.classList.add("on");
}
let tt;function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("on"),2000);}

function setLang(l){LANG=l;$("#zh").setAttribute("aria-pressed",String(l==="zh"));$("#en").setAttribute("aria-pressed",String(l==="en"));applyStatic();}
$("#zh").onclick=()=>setLang("zh");$("#en").onclick=()=>setLang("en");
$("#mintCancel").onclick=closeMint;$("#mintGo").onclick=doMint;
$("#scrim").onclick=e=>{if(e.target===$("#scrim"))closeMint();};
$("#nick").addEventListener("keydown",e=>{if(e.key==="Enter")doMint();});

(async()=>{ try{ await syncRealResults(); }catch(e){}
  try{ if(LANG==="en"){$("#zh").setAttribute("aria-pressed","false");$("#en").setAttribute("aria-pressed","true");} }catch(e){}
  applyStatic(); })();
</script>
