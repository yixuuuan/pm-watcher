  .back{text-decoration:none;font-size:13px;color:var(--mut);border:.5px solid var(--line);background:var(--card);border-radius:9px;padding:5px 11px}

  .sub{color:var(--mut);font-size:13.5px;margin:0 0 16px;max-width:780px}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:22px}
  .mc{background:var(--card);border:.5px solid var(--line);border-radius:14px;padding:13px 15px;border-left:3px solid var(--accent,var(--teal))}
  .mc .l{font-size:12px;color:var(--mut)} .mc .v{font-size:22px;font-weight:650;margin-top:2px;line-height:1.25} .mc .s{font-size:12px;color:var(--hint)}
  .ins{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:10px}
  .in{background:var(--card);border:.5px solid var(--line);border-radius:14px;padding:14px 16px}
  .in b.k{display:block;font-size:12px;letter-spacing:.04em;color:var(--mut);font-weight:600;margin-bottom:3px}
  .in .t{font-size:15px}
  .panel{background:var(--card);border:.5px solid var(--line);border-radius:14px;padding:16px 16px 12px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}

  svg text{font-family:inherit}
  .legend{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 2px}
  .lg{font-size:12px;border:.5px solid var(--line);border-radius:20px;padding:2px 10px 2px 8px;cursor:pointer;background:var(--card);display:inline-flex;align-items:center;gap:6px;color:var(--ink)}

  .lg.off{opacity:.38}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th{font-weight:500;color:var(--mut);font-size:12px;text-align:left;padding:7px 8px;border-bottom:.5px solid var(--line);white-space:nowrap}
  td{padding:8px;border-bottom:.5px solid var(--line);vertical-align:middle}
  tr:last-child td{border-bottom:0}
  .r{text-align:right} .num{font-variant-numeric:tabular-nums}
  .flag{width:18px;height:13px;border-radius:2px;vertical-align:-2px;margin-right:5px;box-shadow:0 0 0 .5px rgba(0,0,0,.12);object-fit:cover}
  .pill{display:inline-block;border-radius:20px;padding:1px 9px;font-size:12px;font-weight:600}
  .up{color:var(--up)} .down{color:var(--down)}

  .go:hover{color:var(--ink);border-color:var(--ink)}

  .tip{position:fixed;z-index:50;pointer-events:none;background:var(--ink);color:#fff;font-size:12px;line-height:1.55;padding:7px 10px;border-radius:8px;display:none;max-width:260px}

// ─── 冠军走势折线图 ───
var RACE_OFF={};
function race(){
  var R=A.race, T=R.t, teams=Object.keys(R.series);
  teams.sort(function(a,b){ return Math.max.apply(null,R.series[b].map(function(v){return v||0;}))-Math.max.apply(null,R.series[a].map(function(v){return v||0;})); });
  var col={}; var fi=0; teams.forEach(function(t){ col[t]=TEAMC[t]||FALLBACK[fi++%FALLBACK.length]; });
  var el=document.getElementById("race"), W=Math.max(320,el.clientWidth||900), H=Math.round(Math.min(420,Math.max(260,W*.42)));
  var pl=38,pr=40,pt=16,pb=26, t0=T[0], t1=T[T.length-1];
  var X=function(t){return pl+(t-t0)/(t1-t0)*(W-pl-pr);}, Y=function(v){return pt+(1-v/100)*(H-pt-pb);};
  var s='<svg viewBox="0 0 '+W+' '+H+'" width="100%" style="display:block;cursor:crosshair" id="raceSvg">';
  [0,25,50,75,100].forEach(function(v){ s+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+Y(v)+'" y2="'+Y(v)+'" stroke="rgba(0,0,0,.07)"/><text x="'+(pl-6)+'" y="'+(Y(v)+4)+'" font-size="10" text-anchor="end" fill="#9a988f">'+v+'%</text>'; });
  // 阶段分隔
  var firstOf=function(r){ var x=A.knockout.filter(function(k){return k.grp===r;}).map(function(k){return k.kickoff;}); return x.length?Math.min.apply(null,x):null; };
  ["R32","R16","QF","SF","FIN"].forEach(function(r){ var t=firstOf(r); if(!t||t<t0) return; var x=X(t);
    s+='<line x1="'+x+'" x2="'+x+'" y1="'+pt+'" y2="'+(H-pb)+'" stroke="rgba(0,0,0,.12)" stroke-dasharray="3,4"/><text x="'+(x+3)+'" y="'+(pt+9)+'" font-size="10" fill="#9a988f">'+stg(r)+'</text>'; });
  // x 轴日期
  var day=86400, d0=Math.ceil(t0/day)*day;
  for(var d=d0; d<=t1; d+=day*4) s+='<text x="'+X(d)+'" y="'+(H-8)+'" font-size="10" text-anchor="middle" fill="#9a988f">'+fmtD(d)+'</text>';
  teams.slice().reverse().forEach(function(t){
    if(RACE_OFF[t]) return;
    var p="", on=false, ser=R.series[t];
    for(var i=0;i<T.length;i++){ var v=ser[i]; if(v==null){ on=false; continue; } p+=(on?"L":"M")+X(T[i]).toFixed(1)+","+Y(v).toFixed(1); on=true; }
    s+='<path d="'+p+'" fill="none" stroke="'+col[t]+'" stroke-width="'+(t===R.champion?2.6:1.6)+'" stroke-linejoin="round" opacity="'+(t===R.champion?1:.85)+'"/>';
  });
  s+='<line id="raceCur" x1="0" x2="0" y1="'+pt+'" y2="'+(H-pb)+'" stroke="#2c2c2a" stroke-width=".8" style="display:none"/></svg>';
  el.innerHTML=s;
  document.getElementById("raceLg").innerHTML=teams.map(function(t){ return '<span class="lg'+(RACE_OFF[t]?" off":"")+'" data-t="'+t+'"><i style="background:'+col[t]+'"></i>'+nm(t)+'</span>'; }).join("");
  var svg=document.getElementById("raceSvg"), cur=document.getElementById("raceCur");
  function at(e){ var r=svg.getBoundingClientRect(), x=(e.clientX-r.left)*(W/r.width); var t=t0+(x-pl)/(W-pl-pr)*(t1-t0);
    var i=0, best=Infinity; for(var k=0;k<T.length;k++){ var d=Math.abs(T[k]-t); if(d<best){best=d;i=k;} } return i; }   // 网格末尾不等距，取最近点
  svg.addEventListener("mousemove",function(e){ var i=at(e); cur.setAttribute("x1",X(T[i])); cur.setAttribute("x2",X(T[i])); cur.style.display="";
    var rows=teams.filter(function(t){return !RACE_OFF[t] && R.series[t][i]!=null;}).sort(function(a,b){return R.series[b][i]-R.series[a][i];}).slice(0,8);
    showTip(e,'<b>'+fmtD(T[i],true)+'</b><br>'+rows.map(function(t){return '<span style="color:'+col[t]+'">●</span> '+nm(t)+' '+R.series[t][i].toFixed(1)+'%';}).join("<br>")+'<br><span style="opacity:.7">'+(LANG==="zh"?"点击 → 回放这一刻":"click → replay this moment")+'</span>'); });
  svg.addEventListener("mouseleave",function(){ cur.style.display="none"; hideTip(); });
  svg.addEventListener("click",function(e){ location.href=replay(T[at(e)]); });
}

  document.getElementById("high").innerHTML=tab(A.highest_scoring);
  document.getElementById("big").innerHTML=tab(A.biggest_wins);
  document.getElementById("ko").innerHTML='<table><tbody>'+A.knockout.map(function(m){ return '<tr><td style="color:#9a988f;width:90px">'+stg(m.grp)+'</td><td>'+score(m)+'</td><td>'+(m.winner?"→ "+tm(m.winner):"")+'</td><td style="color:#9a988f" class="num">'+fmtD(m.kickoff,true)+'</td><td class="r"><a class="go" href="'+replay(m.kickoff-1800)+'">'+L("replay")+' →</a></td></tr>'; }).join("")+'</tbody></table>';
}

function visits(){
  var V=A.visits; if(!V||!V.length){ document.getElementById("visits").innerHTML=""; return; }
  var el=document.getElementById("visits"), W=Math.max(300,el.clientWidth||900), H=180, pl=34, pb=22, mx=Math.max.apply(null,V.map(function(v){return v[1];}));
  var bw=(W-pl-6)/V.length, s='<svg viewBox="0 0 '+W+' '+H+'" width="100%" style="display:block">';
  [0,.5,1].forEach(function(f){ var y=H-pb-f*(H-pb-10); s+='<line x1="'+pl+'" x2="'+W+'" y1="'+y+'" y2="'+y+'" stroke="rgba(0,0,0,.07)"/><text x="'+(pl-5)+'" y="'+(y+4)+'" font-size="10" text-anchor="end" fill="#9a988f">'+Math.round(mx*f)+'</text>'; });
  V.forEach(function(v,i){ var h=v[1]/mx*(H-pb-10), x=pl+i*bw;
    s+='<rect x="'+(x+1).toFixed(1)+'" y="'+(H-pb-h).toFixed(1)+'" width="'+Math.max(1,bw-2).toFixed(1)+'" height="'+h.toFixed(1)+'" rx="2" fill="'+(v===A.overview.peak_day||v[0]===(A.overview.peak_day||[])[0]?"#d85a30":"#1d9e75")+'" data-tip="'+v[0]+' · '+v[1]+(LANG==="zh"?" 次访问 · 独立访客 ":" views · unique ")+v[2]+'"/>';
    if(i%7===0) s+='<text x="'+(x+bw/2)+'" y="'+(H-6)+'" font-size="10" text-anchor="middle" fill="#9a988f">'+v[0].slice(5).replace("-","/")+'</text>'; });
  el.innerHTML=s+'</svg><div class="note" style="margin-top:6px">'+L("total")+" "+A.overview.visits.toLocaleString("en-US")+" · "+L("peak")+" "+A.overview.peak_day[0]+" ("+A.overview.peak_day[1]+")"+'</div>';
}

function method(){
  var o=A.overview, zh=LANG==="zh";
  var items=zh?[
    "数据来源：pm-watcher 在赛事期间对 Polymarket、Kalshi、42、Manifold、Predict 五个平台每约 30 秒抓取一次，只在价格变动 ≥0.1pt 时落盘，共 "+o.snap_rows.toLocaleString("en-US")+" 条定价变动；赛果来自 football-data.org。",
    "单场口径：用「收盘线」（开球前各平台最后一笔），三档都有报价的平台才参与，先归一化再比较。Brier = 三档平方误差之和。Manifold 只有冠军盘（play money），不参与单场统计。",
    "冠军概率走势做过清洗：某平台价格偏离其他平台中位数超过 20pt（多为其他运动的「World Cup」盘同名球队串入）会被剔除；超过 5 天未更新的报价视为下架；球队被淘汰后记 0、决赛后冠军记 100%。",
    "回放看板则如实还原当时线上显示的内容，包括上述串盘污染——它们确实曾出现在当时的网站上。",
    "「被看走眼的球队」与看板「球队名片」同公式：拿分率 = 积分 ÷（场次 × 3）；市场预期 = 各场赛前该队获胜的共识概率平均。"
  ]:[
    "Source: during the tournament pm-watcher polled Polymarket, Kalshi, 42, Manifold and Predict about every 30s, storing a row only when a price moved ≥0.1pt — "+o.snap_rows.toLocaleString("en-US")+" price changes in total. Results from football-data.org.",
    "Matches use the closing line (each platform's last price before kickoff); only platforms quoting all three outcomes count, normalized before comparing. Brier = sum of squared errors over three outcomes. Manifold (play money) only had a title market.",
    "The title-race series is cleaned: prices more than 20pt from the other platforms' median (usually a same-named team from another sport's “World Cup” market) are removed; quotes older than 5 days count as delisted; eliminated teams go to 0 and the champion to 100% after the final.",
    "The replay board, by contrast, shows exactly what the live site showed at the time — including those cross-sport glitches, which really did appear on the site.",
    "“Teams the market misread” uses the Team Cards formula: points rate = points ÷ (matches × 3); expectation = average pre-match consensus win probability."
  ];
  document.getElementById("method").innerHTML=items.map(function(x){return "<li>"+x+"</li>";}).join("");
}

function renderAll(){ statics(); hero(); insights(); race(); startTop(); swings(); hitStage(); draws(); brier(); rel(); upsets(); teams(); plats(); game(); visits(); method(); }
document.querySelectorAll("[data-lang]").forEach(function(b){ b.addEventListener("click",function(){ LANG=b.dataset.lang; try{localStorage.setItem("pmw_lang",JSON.stringify(LANG));}catch(e){} renderAll(); }); });
var rt; addEventListener("resize",function(){ clearTimeout(rt); rt=setTimeout(function(){ if(A){ race(); rel(); visits(); } },200); });
fetch("data/analysis.json").then(function(r){return r.json();}).then(function(j){ A=j; renderAll(); });
})();
</script>
