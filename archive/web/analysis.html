      MP.px=mx-(mx-(MP.px||0))*z2/z1; MP.py=my-(my-(MP.py||0))*z2/z1; MP.zoom=z2;   // 以鼠标所在位置为中心缩放
      orbitHold(); mapView(); mapDeclutter(MP.lastOrder); },{passive:false});
    box.addEventListener("pointermove",function(e){ if(!drag) return; MP.rz=Math.max(-75,Math.min(75,drag.rz+(e.clientX-drag.x)*.3)); MP.tilt=Math.max(0,Math.min(70,drag.tilt-(e.clientY-drag.y)*.25)); mapView(); mapDeclutter(MP.lastOrder); });
    var up=function(){ drag=null; MP.drag=false; orbitHold(3500); box.classList.remove("drag"); }; box.addEventListener("pointerup",up); box.addEventListener("pointercancel",up);
    box.addEventListener("dblclick",function(){ mapTween({tilt:VIEW.tilt,rz:VIEW.rz,z:1},700); });
    document.getElementById("mapFs").addEventListener("click",mapToggleFs);
    var fsc=function(){ if(MP.fs&&!(document.fullscreenElement||document.webkitFullscreenElement)) mapSetFs(false); };
    document.addEventListener("fullscreenchange",fsc); document.addEventListener("webkitfullscreenchange",fsc);
    document.addEventListener("keydown",function(e){ if(e.key==="Escape"&&MP.fs) mapSetFs(false); });
    new IntersectionObserver(function(es){ es.forEach(function(en){
      MP.visible=en.isIntersecting; if(MP.visible) orbitStart();
      if(en.isIntersecting){ if(!MP.started){ MP.started=true; MP.t=MP.t0; MP.last=MP.t0; mapRender(true); mapTween(VIEW,1600); setTimeout(mapPlay,700); } else if(MP.auto){ MP.auto=false; if(MP.t<MP.t1) mapPlay(); } }
      else if(MP.playing){ MP.auto=true; mapPause(); } }); },{threshold:.35}).observe(document.getElementById("s-map"));
    addEventListener("resize",function(){ mapFit(); mapView(); });
  }
  if(!MP.started){ MP.tilt=0; MP.rz=0; } mapView();
}
// 实时访问量：历史累计（analysis.json）+ 存档上线后的新增（/api/visits，每次打开/刷新页面计一次）
var VBASE=null, VLIVE=0, HIT_SENT=false;
function pullVisits(){ var first=!HIT_SENT; HIT_SENT=true;
  return fetch("/api/visits",{method:first?"POST":"GET",cache:"no-store"}).then(function(r){ return r.ok?r.json():null; })
    .then(function(j){ if(j&&typeof j.n==="number"&&j.n!==VLIVE){ VLIVE=j.n; applyVisits(); } }).catch(function(){}); }
function applyVisits(){ if(!A) return; if(VBASE==null) VBASE=A.overview.visits; A.overview.visits=VBASE+VLIVE; footViews();
  var el=document.querySelector("#stats .stat:last-child [data-count]");
  if(el){ el.dataset.count=A.overview.visits; if(el.classList.contains("done")) el.innerHTML=A.overview.visits.toLocaleString("en-US"); } }
function footViews(){ var v=(A.overview||{}).visits; var e=document.getElementById("fViews"); if(e&&v!=null) e.innerHTML='👀 <b class="num">'+v.toLocaleString("en-US")+'</b> '+(LANG==="zh"?"累计访问":"total views"); }
function renderAll(){ statics(); footViews(); hero(); raceInit(); bign(); ucards(); slope(); hitStage(); draws(); brier(); rel(); scatter(); pcards(); game(); mapInit(); method();
  document.querySelectorAll("section.sec").forEach(function(s){ secIO.observe(s); }); observe();
  document.querySelectorAll(".reveal.in .hbar i[data-w]").forEach(function(i){ i.style.width=i.dataset.w; }); }
document.querySelectorAll("[data-lang]").forEach(function(b){ b.addEventListener("click",function(){ LANG=b.dataset.lang; try{localStorage.setItem("pmw_lang",JSON.stringify(LANG));}catch(e){} var f=RB.f, pl=RB.playing; racePause(); renderAll(); RB.f=f; raceRender(); if(pl) racePlay();
  document.querySelectorAll("[data-count]").forEach(function(el){ if(el.closest(".reveal.in")||el.closest(".hero")) countUp(el); }); }); });
var rt; addEventListener("resize",function(){ clearTimeout(rt); rt=setTimeout(function(){ if(!A) return; slope(); rel(); scatter(); if(MP.built) mapRender(true); if(RB.view==="line") raceLine(); },200); });
fetch("data/analysis.json").then(function(r){return r.json();}).then(function(j){ A=j; VBASE=A.overview.visits; renderAll(); pullVisits(); setInterval(pullVisits,60000); document.querySelectorAll(".hero [data-count]").forEach(countUp); });
})();
</script>
<script>
/* 背景：多束「丝带」由上百条细曲线构成，随时间起伏、随滚动与鼠标轻微形变。
   配色取自 2026 世界杯视觉：奖杯金 + 加拿大红 / 墨西哥绿 / 美国蓝。 */
(function(){
  var cv=document.getElementById("fx"); if(!cv||!cv.getContext) return;
  var ctx=cv.getContext("2d"), W=0, H=0, DPR=1, t=0, last=0, raf=0;
  var reduce=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
  var mobile=Math.min(innerWidth,innerHeight)<700;
  var RIB=[
    {c:["#ff2d4b","#ff7a3d","#f0c75e"], y:.34, amp:.13, k:1.25, sp:.17, n:34, fan:.085, ph:0},
    {c:["#2f6bff","#43b8ff","#8f7bff"], y:.56, amp:.11, k:1.65, sp:-.13, n:30, fan:.10, ph:2.1},
    {c:["#12c96f","#20d6c0","#2f6bff"], y:.70, amp:.09, k:1.05, sp:.10, n:24, fan:.07, ph:4.2}
  ];
  if(mobile) RIB.forEach(function(r){ r.n=Math.round(r.n*.6); r.amp*=.55; r.fan*=.7; r.k*=.6; });
  var BUDGET=2.4e6, slow=0, frames=0, still=false;   // 画布最多约 240 万像素；持续掉帧就降级
  var mx=.5, my=.5, tmx=.5, tmy=.5, sy=0, grads=[];
  function hex(h,a){ var n=parseInt(h.slice(1),16); return "rgba("+(n>>16)+","+(n>>8&255)+","+(n&255)+","+a+")"; }
  function resize(){ W=innerWidth; H=innerHeight; DPR=Math.min(window.devicePixelRatio||1,mobile?1.25:1.6,Math.sqrt(BUDGET/(W*H)));
    cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR); ctx.setTransform(DPR,0,0,DPR,0,0);
    grads=RIB.map(function(r){ var g=ctx.createLinearGradient(0,0,W,0); r.c.forEach(function(c,i){ g.addColorStop(i/(r.c.length-1),c); }); return g; });
    if(reduce||still) draw(); }
  // 某一束丝带里第 u 条线（u∈[-.5,.5]）在横坐标 x 处的纵坐标
  function Y(r,u,x,tt,lift){
    var X=x/W, w=X*Math.PI*2*r.k;
    var base=Math.sin(w+tt*r.sp*6+r.ph)*r.amp + Math.sin(w*.47-tt*r.sp*3.1+r.ph*1.7)*r.amp*.55;
    var fan=u*r.fan*(1.1+Math.sin(w*1.3+tt*.45+r.ph)*.9);                 // 线束开合 → 丝带扭转感
    var bump=Math.exp(-Math.pow((X-mx)*3.2,2))*(my-r.y)*.22;               // 鼠标附近轻微牵引
    return (r.y+base+fan+bump-lift)*H;
  }
  function draw(){
    var tt=t, lift=Math.min(sy/H,1.5)*.06, fade=1-Math.min(sy/(H*1.2),1)*.45, step=mobile?16:11;
    ctx.globalCompositeOperation="source-over"; ctx.clearRect(0,0,W,H);
    // 环境光晕
    [[.78,.18,"#ff2d4b",.13],[.12,.82,"#12c96f",.10],[.5,.55,"#2f6bff",.10],[.9,.85,"#f0c75e",.06]].forEach(function(b,i){
      var x=(b[0]+Math.sin(tt*.07+i)*.04)*W, y=(b[1]+Math.cos(tt*.05+i*2)*.04)*H, R=Math.max(W,H)*.55;
      var g=ctx.createRadialGradient(x,y,0,x,y,R); g.addColorStop(0,hex(b[2],b[3]*fade)); g.addColorStop(1,hex(b[2],0));
      ctx.fillStyle=g; ctx.fillRect(0,0,W,H); });
    ctx.globalCompositeOperation="lighter";
    RIB.forEach(function(r,ri){
      // 柔光带：丝带中心的粗描边
      ctx.strokeStyle=grads[ri];
      [[46,.035],[16,.06]].forEach(function(gw){ ctx.globalAlpha=gw[1]*fade; ctx.lineWidth=gw[0]; ctx.beginPath();
        for(var x=-20;x<=W+20;x+=step){ var y=Y(r,0,x,tt,lift); x<=-20?ctx.moveTo(x,y):ctx.lineTo(x,y); } ctx.stroke(); });
      // 细线束
      ctx.lineWidth=.9;
      for(var j=0;j<r.n;j++){ var u=j/(r.n-1)-.5, edge=1-Math.abs(u)*1.6;
        ctx.globalAlpha=(.09+.38*edge*edge)*fade; ctx.beginPath();
        for(var x=-20;x<=W+20;x+=step){ var y=Y(r,u,x,tt,lift); x<=-20?ctx.moveTo(x,y):ctx.lineTo(x,y); }
        ctx.stroke(); }
      // 沿丝带流动的数据光点
      for(var p=0;p<3;p++){ var fx=((tt*.035*(ri%2?-1:1)+p/3+ri*.21)%1+1)%1, x=fx*W, u=(p-1)*.28, y=Y(r,u,x,tt,lift);
        var g=ctx.createRadialGradient(x,y,0,x,y,18); g.addColorStop(0,"rgba(255,255,255,"+(.9*fade)+")"); g.addColorStop(.25,hex(r.c[1],.55*fade)); g.addColorStop(1,hex(r.c[1],0));
        ctx.globalAlpha=1; ctx.fillStyle=g; ctx.fillRect(x-18,y-18,36,36); }
    });
    ctx.globalAlpha=1; ctx.globalCompositeOperation="source-over";
  }
  function loop(now){ raf=requestAnimationFrame(loop); if(now-last<(mobile?40:28)) return;
    var dt=last?Math.min(now-last,100):16; last=now; t+=dt/1000;
    mx+=(tmx-mx)*.04; my+=(tmy-my)*.04;
    var a=performance.now(); draw(); var cost=performance.now()-a;
    frames++; if(cost>18||dt>70) slow++;
    if(frames>=40){                                   // 每 40 帧检查一次：一半以上掉帧 → 先降分辨率/线数，再不行就静止
      if(slow>20){ if(BUDGET>9e5){ BUDGET*=.5; RIB.forEach(function(r){ r.n=Math.max(10,Math.round(r.n*.7)); }); resize(); }
                   else { still=true; cancelAnimationFrame(raf); raf=0; draw(); } }
      frames=0; slow=0; } }
  addEventListener("resize",resize);
  addEventListener("scroll",function(){ sy=scrollY; if(reduce||still) draw(); },{passive:true});
  addEventListener("pointermove",function(e){ tmx=e.clientX/W; tmy=e.clientY/H; },{passive:true});
  document.addEventListener("visibilitychange",function(){ if(document.hidden){ cancelAnimationFrame(raf); raf=0; } else if(!reduce&&!still&&!raf){ last=0; raf=requestAnimationFrame(loop); } });
  resize(); t=reduce?8:0; if(reduce) draw(); else raf=requestAnimationFrame(loop);
})();
</script>
